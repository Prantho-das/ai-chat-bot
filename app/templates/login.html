<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F5F7FB] text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MarketFlow AI Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', 'Noto Sans Bengali', sans-serif; }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-[#F5F7FB] via-indigo-50/40 to-slate-100 flex items-center justify-center p-4 antialiased relative overflow-hidden">
    <!-- Ambient Background Light Blur -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-[#5B4BFF]/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-[#7C3AED]/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Logo & Header -->
        <div class="text-center space-y-3 mb-8">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#5B4BFF] to-[#7C3AED] items-center justify-center text-white text-2xl font-bold shadow-xl shadow-[#5B4BFF]/30 ring-8 ring-indigo-50/80">
                ⚡
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight flex items-center justify-center gap-2">
                    MarketFlow <span class="text-xs bg-[#5B4BFF]/10 text-[#5B4BFF] font-extrabold px-2 py-0.5 rounded-md border border-[#5B4BFF]/20">AI PRO</span>
                </h1>
                <p class="text-xs font-semibold text-slate-400 mt-1">Enterprise Automation Portal</p>
            </div>
        </div>

        <!-- Main Login Card -->
        <div class="bg-white/95 border border-slate-200/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl shadow-slate-300/50 space-y-6">
            
            <div class="border-b border-slate-100 pb-4 text-center">
                <h2 class="text-base font-extrabold text-slate-900 tracking-tight">Welcome Back</h2>
                <p class="text-xs text-slate-400 font-medium mt-1">অ্যাডমিন ড্যাশবোর্ডে প্রবেশ করতে লগইন করুন</p>
            </div>

            {% if error %}
            <div class="p-3.5 bg-rose-50 border border-rose-200/80 rounded-2xl text-rose-700 text-xs font-semibold flex items-center justify-center space-x-2">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/admin/login" method="POST" class="space-y-5">
                <div>
                    <label class="block text-[11px] font-extrabold text-slate-600 mb-1.5 uppercase tracking-wider">Username</label>
                    <div class="relative">
                        <input type="text" name="username" required placeholder="Enter username" class="w-full bg-slate-50/70 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-xs font-semibold text-slate-900 focus:bg-white focus:outline-none focus:border-[#5B4BFF] focus:ring-4 focus:ring-[#5B4BFF]/15 transition-all">
                        <span class="absolute left-3.5 top-3 text-slate-400 text-sm">👤</span>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-[11px] font-extrabold text-slate-600 uppercase tracking-wider">Password</label>
                    </div>
                    <div class="relative">
                        <input type="password" name="password" required placeholder="Enter password" class="w-full bg-slate-50/70 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-xs font-semibold text-slate-900 focus:bg-white focus:outline-none focus:border-[#5B4BFF] focus:ring-4 focus:ring-[#5B4BFF]/15 transition-all">
                        <span class="absolute left-3.5 top-3 text-slate-400 text-sm">🔒</span>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-[#5B4BFF] to-[#7C3AED] hover:from-[#4C3CE6] hover:to-[#6D28D9] text-white font-extrabold py-3.5 rounded-xl text-xs transition-all shadow-lg shadow-[#5B4BFF]/25 flex items-center justify-center space-x-2 cursor-pointer border-0">
                        <span>Sign In to Dashboard</span>
                        <span>→</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-400 font-medium mt-6">
            © 2026 MarketFlow AI Engine • Protected Enterprise Portal
        </p>

    </div>
</body>
</html>
