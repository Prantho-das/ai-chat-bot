<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0B1020] text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Piku AI Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', 'Noto Sans Bengali', sans-serif; }
    </style>
</head>
<body class="h-full bg-[#0B1020] flex items-center justify-center p-4 antialiased relative overflow-hidden text-slate-100">
    <!-- Ambient Background Light Blur -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Logo & Header -->
        <div class="text-center space-y-3 mb-8">
            <img src="/static/piku_logo.png" alt="Piku AI Logo" class="w-16 h-16 rounded-2xl object-cover mx-auto shadow-2xl ring-4 ring-blue-500/30">
            <div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center justify-center gap-2">
                    Piku <span class="text-xs bg-blue-500/20 text-blue-300 font-extrabold px-2 py-0.5 rounded-md border border-blue-500/40">AI PRO</span>
                </h1>
                <p class="text-xs font-semibold text-slate-400 mt-1">Smart Customer Support Portal</p>
            </div>
        </div>

        <!-- Main Login Card -->
        <div class="bg-[#0F172A] border border-slate-800/90 backdrop-blur-xl rounded-3xl p-8 shadow-2xl space-y-6">
            
            <div class="border-b border-slate-800 pb-4 text-center">
                <h2 class="text-base font-extrabold text-white tracking-tight">Welcome Back</h2>
                <p class="text-xs text-slate-400 font-medium mt-1">অ্যাডমিন ড্যাশবোর্ডে প্রবেশ করতে লগইন করুন</p>
            </div>

            {% if error %}
            <div class="p-3.5 bg-rose-500/15 border border-rose-500/30 rounded-2xl text-rose-300 text-xs font-semibold flex items-center justify-center space-x-2">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/admin/login" method="POST" class="space-y-5">
                <div>
                    <label class="block text-[11px] font-extrabold text-slate-400 mb-1.5 uppercase tracking-wider">Username</label>
                    <div class="relative">
                        <input type="text" name="username" required placeholder="Enter username" class="w-full bg-[#0B1020] border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-xs font-semibold text-white focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 transition-all">
                        <span class="absolute left-3.5 top-3 text-slate-500 text-sm">👤</span>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">Password</label>
                    </div>
                    <div class="relative">
                        <input type="password" name="password" required placeholder="Enter password" class="w-full bg-[#0B1020] border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-xs font-semibold text-white focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 transition-all">
                        <span class="absolute left-3.5 top-3 text-slate-500 text-sm">🔒</span>
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-xs py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition-all border-0 cursor-pointer">
                    Sign In to Dashboard →
                </button>
            </form>
        </div>

        <div class="text-center mt-6 text-xs text-slate-500 font-medium">
            Piku AI Bot System • Secured Access
        </div>

    </div>
</body>
</html>
