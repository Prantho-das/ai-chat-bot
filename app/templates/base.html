<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Chatbot Admin{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col md:flex-row bg-slate-50/50 text-slate-800 antialiased">

    {% if request.cookies.get("admin_session") %}
    <!-- Sidebar Navigation -->
    <aside class="w-full md:w-64 bg-white border-r border-slate-200/80 flex flex-col shrink-0 shadow-sm">
        <div class="p-6 border-b border-slate-100 flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-indigo-600/20">
                ⚡
            </div>
            <div>
                <h1 class="font-bold text-base text-slate-900 tracking-tight">MarketFlow</h1>
                <p class="text-xs text-slate-400 font-medium">AI Chatbot Admin</p>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1">
            <a href="/admin" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all hover:bg-slate-100/80 text-slate-600 hover:text-slate-900">
                <span class="text-base">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="/admin/conversations" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all hover:bg-slate-100/80 text-slate-600 hover:text-slate-900">
                <span class="text-base">💬</span>
                <span>Conversations</span>
            </a>
            <a href="/admin/knowledge" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all hover:bg-slate-100/80 text-slate-600 hover:text-slate-900">
                <span class="text-base">🧠</span>
                <span>Knowledge Base</span>
            </a>
            <a href="/admin/settings" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all hover:bg-slate-100/80 text-slate-600 hover:text-slate-900">
                <span class="text-base">⚙️</span>
                <span>Bot Settings</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-100">
            <a href="/admin/logout" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-rose-600 hover:bg-rose-50 transition-all">
                <span class="text-base">🚪</span>
                <span>Logout</span>
            </a>
        </div>
    </aside>
    {% endif %}

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-h-screen overflow-y-auto">
        <header class="h-16 bg-white/80 border-b border-slate-200/80 backdrop-blur flex items-center justify-between px-8 sticky top-0 z-10">
            <h2 class="font-bold text-lg text-slate-900 tracking-tight">{% block header_title %}Dashboard{% endblock %}</h2>
            <div class="flex items-center space-x-4">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/60 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span> System Active
                </span>
            </div>
        </header>

        <div class="p-8 flex-1 max-w-7xl w-full mx-auto">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
